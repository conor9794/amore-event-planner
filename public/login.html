<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amore Event Planner — Sign In</title>
<style>
* { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:system-ui,-apple-system,sans-serif; background:#f6f7f9; color:#1f2631;}
main { width:min(94vw,420px); background:white; padding:34px; border:1px solid #e2e6eb; border-radius:18px; box-shadow:0 15px 44px rgba(0,0,0,.06); }
.eyebrow { color:#ad181b; font-weight:800; letter-spacing:2px; font-size:11px; text-transform:uppercase; } h1 { margin:8px 0; font-size:29px; } p {color:#657080; font-size:14px;line-height:1.5}
label { display:block;margin-top:18px;font-weight:700;font-size:14px } input { width:100%; height:46px;border-radius:9px;border:1px solid #d5d9dd;margin-top:7px;padding:10px 12px;font:inherit }
button { margin-top:23px;width:100%;height:46px;border:0;border-radius:9px;background:#ba1c20;color:#fff;font:inherit;font-weight:700;cursor:pointer }
button:disabled {opacity:.65;cursor:wait } #message { margin-top:15px;color:#a0171c;min-height:20px;font-size:14px } .foot { font-size:12px;color:#77818c}
</style></head>
<body><main><div class="eyebrow">Amore Staffing</div><h1>Event Planner</h1><p>Authorized Amore operators only. Sign in with your assigned email address and password.</p>
<form id="login"><label>Email address<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label>
<button id="submit" type="submit">Sign In</button><div id="message" role="alert" aria-live="polite"></div></form><p class="foot"><a href="/reset-password.html">Forgot password?</a></p><p class="foot">Only approved Amore operators can sign in.</p></main>
<script>
const form = document.getElementById("login"), message = document.getElementById("message"), submit = document.getElementById("submit");
form.addEventListener("submit", async (e) => {
  e.preventDefault(); message.textContent = ""; submit.disabled = true;
  try {
    const result = await fetch("/api/planner-auth", {method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      email:document.getElementById("email").value, password:document.getElementById("password").value
    })});
    const data = await result.json();
    if (!result.ok) throw new Error(data.error || "Sign in failed.");
    window.location.replace("/");
  } catch (err) { message.textContent = err.message; }
  finally { submit.disabled = false; }
});
</script></body></html>
