<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Change Password — Amore Event Planner</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f7f9;color:#1f2631;font-family:system-ui,-apple-system,sans-serif}
main{width:min(94vw,440px);background:white;border:1px solid #e2e6eb;border-radius:18px;padding:32px;box-shadow:0 15px 44px #0000000d}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#ad181b;font-weight:800}h1{margin:8px 0;font-size:27px}p{color:#657080;font-size:14px;line-height:1.5}
label{display:block;margin-top:18px;font-size:14px;font-weight:700}input{width:100%;height:45px;padding:10px 12px;margin-top:7px;border:1px solid #d5d9dd;border-radius:9px;font:inherit}
button{width:100%;padding:13px;background:#ba1c20;color:white;border:0;border-radius:9px;font:inherit;font-weight:700;margin-top:22px;cursor:pointer}button:disabled{opacity:.65}
a{color:#9a1b20}.msg{min-height:20px;margin:14px 0;font-size:14px}.error{color:#b00020}.success{color:#126533}.hidden{display:none}.foot{font-size:13px;margin-top:18px}
</style></head>
<body><main><div class="eyebrow">Amore Staffing</div><h1>Change Password</h1><p>Set a private password for your individual Event Planner account. You'll sign in again after saving it.</p>
<form id="changeForm">
<label>Current password<input id="current" type="password" autocomplete="current-password" required></label>
<label>New password<input id="new" type="password" autocomplete="new-password" minlength="14" maxlength="128" required></label>
<label>Confirm new password<input id="confirm" type="password" autocomplete="new-password" minlength="14" maxlength="128" required></label>
<p>Use a unique password or passphrase of at least 14 characters.</p>
<button type="submit" id="submit">Update password</button><div id="message" class="msg" role="status" aria-live="polite"></div>
</form><p class="foot"><a href="/">Back to Event Planner</a></p></main>
<script>
const form=document.getElementById("changeForm"),msg=document.getElementById("message"),button=document.getElementById("submit");
form.addEventListener("submit",async e=>{
e.preventDefault();msg.className="msg";msg.textContent="";
const newPassword=document.getElementById("new").value,confirm=document.getElementById("confirm").value;
if(newPassword!==confirm){msg.className="msg error";msg.textContent="New passwords do not match.";return;}
button.disabled=true;
try{
const res=await fetch("/api/planner-password-v2",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"change",currentPassword:document.getElementById("current").value,newPassword})});
const data=await res.json();if(!res.ok)throw Error(data.error||"Could not update password.");
form.reset();msg.className="msg success";msg.textContent="Password updated. Redirecting to sign in…";setTimeout(()=>location.replace("/login.html"),1300);
}catch(err){msg.className="msg error";msg.textContent=err.message;}finally{button.disabled=false;}
});
</script></body></html>
