<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Password Recovery — Amore Event Planner</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f7f9;color:#1f2631;font-family:system-ui,-apple-system,sans-serif}
main{width:min(94vw,440px);background:white;border:1px solid #e2e6eb;border-radius:18px;padding:32px;box-shadow:0 15px 44px #0000000d}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#ad181b;font-weight:800}h1{margin:8px 0;font-size:27px}p{color:#657080;font-size:14px;line-height:1.5}
label{display:block;margin-top:18px;font-size:14px;font-weight:700}input{width:100%;height:45px;padding:10px 12px;margin-top:7px;border:1px solid #d5d9dd;border-radius:9px;font:inherit}
button{width:100%;padding:13px;background:#ba1c20;color:white;border:0;border-radius:9px;font:inherit;font-weight:700;margin-top:22px;cursor:pointer}button:disabled{opacity:.65}
a{color:#9a1b20}.msg{min-height:20px;margin:14px 0;font-size:14px}.error{color:#b00020}.success{color:#126533}.hidden{display:none}.foot{font-size:13px;margin-top:18px}
</style></head>
<body><main><div class="eyebrow">Amore Staffing</div><h1>Reset Password</h1>
<form id="requestForm"><p>Enter your approved operator email address. If email recovery is enabled, we'll send you a private reset link.</p>
<label>Email address<input id="requestEmail" type="email" autocomplete="email" required></label>
<button id="requestSubmit" type="submit">Send reset link</button></form>
<form id="resetForm" class="hidden"><p>Choose a new password for your Amore Event Planner account. Reset links expire after 15 minutes and work only once.</p>
<label>New password<input id="new" type="password" autocomplete="new-password" minlength="14" maxlength="128" required></label>
<label>Confirm new password<input id="confirm" type="password" autocomplete="new-password" minlength="14" maxlength="128" required></label>
<button id="resetSubmit" type="submit">Save new password</button></form>
<div id="message" class="msg" role="status" aria-live="polite"></div><p class="foot"><a href="/login.html">Back to sign in</a></p></main>
<script>
const params=new URLSearchParams(location.search),token=params.get("token"),email=params.get("email");
history.replaceState(null,"",location.pathname);
const msg=document.getElementById("message");function show(text,error=false){msg.textContent=text;msg.className="msg "+(error?"error":"success");}
if(token && email){document.getElementById("requestForm").classList.add("hidden");document.getElementById("resetForm").classList.remove("hidden");}
document.getElementById("requestForm").addEventListener("submit",async e=>{
e.preventDefault();const button=document.getElementById("requestSubmit");button.disabled=true;show("");
try{const res=await fetch("/api/planner-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"request",email:document.getElementById("requestEmail").value})});const data=await res.json();if(!res.ok)throw Error(data.error||"Could not request reset.");show(data.message||"Check your email for a reset link.");}
catch(err){show(err.message,true);}finally{button.disabled=false;}
});
document.getElementById("resetForm").addEventListener("submit",async e=>{
e.preventDefault();const button=document.getElementById("resetSubmit"),password=document.getElementById("new").value,confirm=document.getElementById("confirm").value;
if(password!==confirm)return show("Passwords do not match.",true);button.disabled=true;
try{const res=await fetch("/api/planner-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"reset",email,token,newPassword:password})});const data=await res.json();if(!res.ok)throw Error(data.error||"Reset failed.");document.getElementById("resetForm").reset();show("Your password was updated. You can now sign in.");}
catch(err){show(err.message,true);}finally{button.disabled=false;}
});
</script></body></html>
